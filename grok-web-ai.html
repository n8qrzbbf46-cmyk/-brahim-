<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sen LLM Geliştirme • Akıllı Simülasyon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
        
        body {
            font-family: 'Inter', system_ui, sans-serif;
        }
        
        .font-display {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            font-weight: 600;
        }

        .typing-dot {
            animation: bounce 1.2s infinite ease-in-out;
        }

        .chat-container {
            scrollbar-width: thin;
            scrollbar-color: #3f3f46 #18181b;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200">
    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="border-b border-zinc-800 bg-zinc-900/80 backdrop-blur-lg sticky top-0 z-40">
            <div class="max-w-4xl mx-auto px-5 py-4 flex items-center justify-between">
                <div class="flex items-center gap-x-3">
                    <div class="w-11 h-11 bg-white rounded-2xl flex items-center justify-center shadow-inner">
                        <span class="text-zinc-950 font-display text-3xl font-bold tracking-tighter">LLM</span>
                    </div>
                    <div>
                        <h1 class="font-display text-3xl tracking-tighter font-semibold">Sen LLM Geliştirme</h1>
                        <p class="text-[10px] text-zinc-500 -mt-1">Akıllı • Bağlamı Anlayan • Doğal Konuşma</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-x-2">
                    <button id="clearBtn"
                            class="flex items-center gap-x-2 px-4 py-2 text-sm font-medium bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 transition-all rounded-2xl border border-zinc-700">
                        <i class="fa-solid fa-trash text-xs"></i>
                        <span class="hidden sm:inline">Sohbeti Temizle</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Chat Area -->
        <div class="flex-1 max-w-4xl mx-auto w-full px-5 pt-6 pb-32">
            <div id="chatContainer" 
                 class="chat-container space-y-6 max-h-[calc(100vh-280px)] min-h-[420px] overflow-y-auto pr-1 scroll-smooth">
            </div>
        </div>

        <!-- Input Bar -->
        <div class="fixed bottom-0 left-0 right-0 bg-zinc-900/95 backdrop-blur-xl border-t border-zinc-800 z-50">
            <div class="max-w-4xl mx-auto px-5 py-4">
                <div class="flex items-end gap-3 bg-zinc-800 border border-zinc-700 rounded-3xl p-2 shadow-2xl">
                    <div class="flex-1 relative">
                        <textarea id="userInput" rows="1"
                                  class="w-full bg-transparent px-5 py-3.5 text-[15px] placeholder:text-zinc-500 focus:outline-none resize-none max-h-[120px] leading-relaxed"
                                  placeholder="Ne demek istediğini yaz... uzun metin, teknik soru, sohbet hepsi olur"></textarea>
                    </div>
                    
                    <button id="sendBtn"
                            class="flex-shrink-0 w-12 h-12 flex items-center justify-center bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 transition-all text-white rounded-2xl shadow-inner">
                        <i class="fa-solid fa-paper-plane text-lg"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // Sen LLM Geliştirme - Akıllı ve Doğal Konuşan Simülasyon
        // Güçlü bağlam + Direkt anlama + Doğal cevaplar
        // ============================================================

        let conversation = [];
        
        let chatContainer, userInput, sendBtn, clearBtn;
        
        function initElements() {
            chatContainer = document.getElementById('chatContainer');
            userInput = document.getElementById('userInput');
            sendBtn = document.getElementById('sendBtn');
            clearBtn = document.getElementById('clearBtn');
        }
        
        function addMessageToUI(role, content) {
            const messageWrapper = document.createElement('div');
            messageWrapper.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} message-user`;
            
            if (role === 'user') {
                const bubble = document.createElement('div');
                bubble.className = `max-w-[78%] px-5 py-3.5 rounded-3xl text-[15px] leading-relaxed bg-indigo-600 text-white rounded-br-none shadow-inner`;
                bubble.textContent = content;
                messageWrapper.appendChild(bubble);
            } else {
                const flexContainer = document.createElement('div');
                flexContainer.className = 'flex gap-3 max-w-[87%]';
                
                const avatar = document.createElement('div');
                avatar.className = 'w-8 h-8 bg-white rounded-2xl flex-shrink-0 flex items-center justify-center text-zinc-950 font-display text-xl font-bold shadow-sm mt-0.5';
                avatar.innerHTML = 'LLM';
                
                const bubble = document.createElement('div');
                bubble.className = `px-5 py-3.5 rounded-3xl text-[15px] leading-relaxed bg-zinc-800 text-zinc-100 rounded-bl-none flex-1`;
                bubble.textContent = content;
                
                flexContainer.appendChild(avatar);
                flexContainer.appendChild(bubble);
                messageWrapper.appendChild(flexContainer);
            }
            
            chatContainer.appendChild(messageWrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function showTypingIndicator() {
            const typingWrapper = document.createElement('div');
            typingWrapper.className = `flex justify-start typing-indicator`;
            typingWrapper.innerHTML = `
                <div class="flex gap-3 max-w-[87%]">
                    <div class="w-8 h-8 bg-white rounded-2xl flex-shrink-0 flex items-center justify-center text-zinc-950 font-display text-xl font-bold shadow-sm mt-0.5">
                        LLM
                    </div>
                    <div class="bg-zinc-800 px-5 py-3.5 rounded-3xl rounded-bl-none flex items-center gap-1.5">
                        <div class="w-1.5 h-1.5 bg-zinc-400 rounded-full typing-dot" style="animation-delay: 0ms"></div>
                        <div class="w-1.5 h-1.5 bg-zinc-400 rounded-full typing-dot" style="animation-delay: 180ms"></div>
                        <div class="w-1.5 h-1.5 bg-zinc-400 rounded-full typing-dot" style="animation-delay: 360ms"></div>
                    </div>
                </div>
            `;
            chatContainer.appendChild(typingWrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return typingWrapper;
        }
        
        function getLLMResponse(message, history) {
            const lowerMsg = message.toLowerCase().trim();
            const msgLength = message.length;
            
            // Güçlü bağlam (son 7 mesaj)
            const recentHistory = history.slice(-7);
            const contextText = recentHistory.map(m => m.content).join(' ');
            const fullContext = (contextText + ' ' + lowerMsg).toLowerCase();
            
            // Hafızada tutulan konular
            const topics = [];
            if (fullContext.includes('transformer')) topics.push('transformer');
            if (fullContext.includes('token')) topics.push('token');
            if (fullContext.includes('inference')) topics.push('inference');
            if (fullContext.includes('eğitim')) topics.push('eğitim');
            if (fullContext.includes('parametre')) topics.push('parametre');
            
            // === OKUMA-ANLAMA ===
            if (msgLength > 180) {
                const parts = message.split(/[.!?]+/).filter(s => s.trim().length > 8);
                return `Verdiğin metni okudum. Kısa özet: ${parts[0] ? parts[0].trim() + '.' : 'Metin uzun ve detaylı.'} 
Ana noktalar: ${parts.slice(0, 2).map(p => p.trim()).join(' • ')}. 
Bu konuda ne öğrenmek istersin? Özet mi, analiz mi, yoksa belirli bir soruya cevap mı?`;
            }
            
            // === ŞAKA ===
            if (lowerMsg.includes('şaka') || lowerMsg.includes('espri') || lowerMsg.includes('komik')) {
                return "Tamam, işte sana hafif bir espri: LLM'ler neden yorgun olmaz? Çünkü her zaman 'next token' peşinde koşuyorlar ama bazen yanlış yere gidiyorlar! 😄 Devam edelim mi?";
            }
            
            // === TEKNİK KONULAR ===
            if (lowerMsg.includes('llm') || lowerMsg.includes('büyük dil modeli')) {
                return "LLM'ler büyük miktarda metin verisiyle eğitilen modellerdir. Temel işleri, verilen bağlamda en mantıklı kelimeyi tahmin etmektir. Transformer yapısı sayesinde kelimeler arasındaki ilişkiyi iyi yakalarlar. Başka ne sormak istersin bu konuda?";
            }
            
            if (lowerMsg.includes('transformer')) {
                return "Transformer, 2017'de çıkan ve şu anda neredeyse tüm güçlü LLM'lerin temelini oluşturan mimaridir. Self-attention sayesinde bir cümledeki her kelime diğer kelimelerle doğrudan ilişki kurabilir. Bu sayede daha iyi anlam çıkarır. Detay ister misin?";
            }
            
            if (lowerMsg.includes('token')) {
                return "Token, modelin metni parçaladığı en küçük birimdir. Bazı kelimeler tek token olur, bazıları birden fazla. Tokenizer kalitesi modelin performansını doğrudan etkiler. Türkçe'de ekler olduğu için bu konu biraz daha karmaşık. Ne öğrenmek istersin?";
            }
            
            if (lowerMsg.includes('inference')) {
                return "Inference, modelin eğitildikten sonra yeni sorulara cevap üretme sürecidir. Gerçek hayatta GPU'larda yapılır ve KV cache gibi optimizasyonlarla hızlandırılır. Bu uygulamada ben de aynı mantıkla çalışıyorum. Başka bir şey sormak ister misin?";
            }
            
            // === BAĞLAM TAKİBİ ===
            if (fullContext.includes('önceki') || fullContext.includes('az önce') || fullContext.includes('dedin') || fullContext.includes('bahset')) {
                let reply = "Evet, az önceki mesajında bahsettiğin konuyu hatırlıyorum. ";
                if (topics.length > 0) reply += `Özellikle ${topics.join(', ')} hakkında konuşuyorduk. `;
                reply += "Devam edelim mi, yoksa başka bir şey mi sormak istersin?";
                return reply;
            }
            
            // === DOĞRUDAN VE DOĞAL CEVAPLAR ===
            // Kullanıcının mesajını doğrudan ele alan doğal cevaplar
            const directAnswers = [
                `Anladım. Bu konuda şöyle düşünebiliriz: ${message.length > 40 ? 'Verdiğin detaylar oldukça net' : 'Konu net görünüyor'}. Daha fazla bilgi verirsen daha iyi yardımcı olabilirim.`,
                
                `Doğru, bu mantıklı bir soru. Ben de aynı şekilde düşünüyorum. Gerçek hayatta da bu tarz konular sıkça tartışılıyor. Ne dersin, derinleştirelim mi?`,
                
                `Tam olarak ne demek istediğini anladım. Bu konuda en önemli nokta bence ${topics.length > 0 ? topics[0] + ' ile ilgili kısım' : 'bağlamı iyi kurmak'}. Başka bir açıdan bakmamı ister misin?`,
                
                `Evet, haklısın. Bu tarz şeyler genellikle ${message.includes('?') ? 'soru işareti bırakır' : 'daha fazla düşünmeyi gerektirir'}. Devam edelim, ne öğrenmek istersin tam olarak?`,
                
                `Anladım seni. Bu konuda en pratik yaklaşım şu: önce temelini oturtmak, sonra detaylara inmek. Sen ne düşünüyorsun? Ben de kendi görüşümü söyleyeyim istersen.`
            ];
            
            let answer = directAnswers[Math.floor(Math.random() * directAnswers.length)];
            
            // Hafıza ekle
            if (topics.length >= 1) {
                answer += ` (Bu arada ${topics.join(' ve ')} konularını da konuşmuştuk, onları da aklımda tutuyorum.)`;
            }
            
            return answer;
        }
        
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            
            conversation.push({ role: 'user', content: text });
            addMessageToUI('user', text);
            
            userInput.value = '';
            userInput.style.height = 'auto';
            
            const typingIndicator = showTypingIndicator();
            userInput.disabled = true;
            sendBtn.disabled = true;
            
            await new Promise(resolve => setTimeout(resolve, 600 + Math.random() * 500));
            
            const aiResponse = getLLMResponse(text, conversation);
            
            if (typingIndicator && typingIndicator.parentNode) {
                typingIndicator.parentNode.removeChild(typingIndicator);
            }
            
            conversation.push({ role: 'assistant', content: aiResponse });
            addMessageToUI('assistant', aiResponse);
            
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }
        
        function setupEventListeners() {
            sendBtn.addEventListener('click', sendMessage);
            
            userInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            userInput.addEventListener('input', function() {
                this.style.height = 'auto';
                const newHeight = Math.min(this.scrollHeight, 120);
                this.style.height = newHeight + 'px';
            });
            
            clearBtn.addEventListener('click', function() {
                if (confirm('Sohbeti temizlemek istediğine emin misin?')) {
                    conversation = [];
                    chatContainer.innerHTML = '';
                    addMessageToUI('assistant', 'Tamam, sohbet temizlendi. Şimdi ne demek istediğini anlat, düzgün dinleyip cevap vereyim.');
                }
            });
            
            setTimeout(() => {
                if (chatContainer.children.length === 0) {
                    addMessageToUI('assistant', 'Merhaba! Artık daha iyi anlıyorum. Ne demek istediğini yaz, bağlamı takip ederek ve direkt cevap vererek konuşalım. Uzun metin de olur, normal sohbet de.');
                }
            }, 600);
        }
        
        function init() {
            initElements();
            setupEventListeners();
        }
        
        window.onload = init;
    </script>
</body>
</html>
