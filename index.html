<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { STLExporter } from 'three/addons/exporters/STLExporter.js';

const CATS = ['Hepsi','Tasarım','Primitif','Profil','Bağlantı','Dişli','Makine','Montaj'];

function steel(color=0xc5d0dc, metal=0.72, rough=0.32) {
  return new THREE.MeshStandardMaterial({ color, metalness:metal, roughness:rough, side:THREE.DoubleSide });
}
function rubber(color=0x222226) {
  return new THREE.MeshStandardMaterial({ color, metalness:0.05, roughness:0.85, side:THREE.DoubleSide });
}
function extrude(shape, depth, bevel=false) {
  return new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled:bevel, bevelThickness:bevel?0.35:0, bevelSize:bevel?0.25:0, curveSegments:16 });
}
function hexShape(r) {
  const s = new THREE.Shape();
  for (let i=0;i<6;i++) {
    const a = i/6*Math.PI*2 + Math.PI/6;
    const x=Math.cos(a)*r, y=Math.sin(a)*r;
    i ? s.lineTo(x,y) : s.moveTo(x,y);
  }
  s.closePath(); return s;
}
function ringShape(outer, inner) {
  const s = new THREE.Shape();
  s.absarc(0,0,outer,0,Math.PI*2,false);
  const h = new THREE.Path(); h.absarc(0,0,inner,0,Math.PI*2,true);
  s.holes.push(h); return s;
}
function iBeamShape(w,h,tw,tf) {
  const s=new THREE.Shape(), hw=w/2, hh=h/2;
  s.moveTo(-hw,-hh); s.lineTo(hw,-hh); s.lineTo(hw,-hh+tf); s.lineTo(tw/2,-hh+tf);
  s.lineTo(tw/2,hh-tf); s.lineTo(hw,hh-tf); s.lineTo(hw,hh); s.lineTo(-hw,hh);
  s.lineTo(-hw,hh-tf); s.lineTo(-tw/2,hh-tf); s.lineTo(-tw/2,-hh+tf); s.lineTo(-hw,-hh+tf);
  s.closePath(); return s;
}
function uShape(w,h,t) {
  const s=new THREE.Shape();
  s.moveTo(-w/2,-h/2); s.lineTo(w/2,-h/2); s.lineTo(w/2,-h/2+t); s.lineTo(-w/2+t,-h/2+t);
  s.lineTo(-w/2+t,h/2-t); s.lineTo(w/2,h/2-t); s.lineTo(w/2,h/2); s.lineTo(-w/2,h/2);
  s.closePath(); return s;
}
function lShape(w,h,t) {
  const s=new THREE.Shape();
  s.moveTo(0,0); s.lineTo(w,0); s.lineTo(w,t); s.lineTo(t,t); s.lineTo(t,h); s.lineTo(0,h);
  s.closePath(); return s;
}
function tShape(w,h,tw,tf) {
  const s=new THREE.Shape();
  s.moveTo(-w/2,h/2); s.lineTo(w/2,h/2); s.lineTo(w/2,h/2-tf); s.lineTo(tw/2,h/2-tf);
  s.lineTo(tw/2,-h/2); s.lineTo(-tw/2,-h/2); s.lineTo(-tw/2,h/2-tf); s.lineTo(-w/2,h/2-tf);
  s.closePath(); return s;
}
function gearShape(teeth,rOuter,rInner,tooth=2.2) {
  const s=new THREE.Shape(), rRoot=rOuter-tooth;
  for (let i=0;i<teeth;i++) {
    const a=i/teeth*Math.PI*2, step=Math.PI*2/teeth;
    const p=(k,r)=>[Math.cos(a+k*step)*r, Math.sin(a+k*step)*r];
    const pts=[p(0,rRoot),p(.18,rRoot),p(.28,rOuter),p(.48,rOuter),p(.58,rRoot)];
    i?s.lineTo(...pts[0]):s.moveTo(...pts[0]);
    pts.slice(1).forEach(q=>s.lineTo(...q));
  }
  s.closePath();
  const hole=new THREE.Path(); hole.absarc(0,0,rInner,0,Math.PI*2,true); s.holes.push(hole);
  return s;
}
function alongX(geo){ geo.rotateY(Math.PI/2); geo.center(); return geo; }
function helixCurve(r,turns,h){
  class Helix extends THREE.Curve {
    getPoint(t,o=new THREE.Vector3()){
      const a=t*turns*Math.PI*2;
      return o.set(Math.cos(a)*r,(t-0.5)*h,Math.sin(a)*r);
    }
  }
  return new Helix();
}
function applyMesh(o){
  o.traverse(n=>{
    if(n.isMesh){ n.castShadow=true; n.receiveShadow=true; }
  });
  return o;
}

/* ---------------- parametric builders (axis = local X) ---------------- */
const ISO_BOLT = {
  M4:{d:4, head:7, h:2.8, nut:3.2},
  M5:{d:5, head:8, h:3.5, nut:4},
  M6:{d:6, head:10,h:4,   nut:5},
  M8:{d:8, head:13,h:5.3, nut:6.5},
  M10:{d:10,head:16,h:6.4, nut:8},
  M12:{d:12,head:18,h:7.5, nut:10},
  M16:{d:16,head:24,h:10,  nut:13},
  M20:{d:20,head:30,h:12.5,nut:16}
};

function buildBolt(p){
  const spec = ISO_BOLT[p.size] || ISO_BOLT.M8;
  const d=spec.d, L=p.length, headR=spec.head/2, headH=spec.h;
  const g=new THREE.Group();
  const head=new THREE.Mesh(extrude(hexShape(headR), headH), steel(0xd0d6de));
  head.rotation.y=Math.PI/2; head.position.x=-L/2;
  const shank=new THREE.Mesh(new THREE.CylinderGeometry(d/2,d/2,L,20), steel(0xb8c2cc));
  shank.rotation.z=Math.PI/2;
  // basit diş görünümü
  const turns=Math.max(4, Math.floor(L/d));
  class Helix extends THREE.Curve {
    getPoint(t,o=new THREE.Vector3()){
      const a=t*turns*Math.PI*2;
      return o.set((t-0.5)*L, Math.cos(a)*(d/2+0.15), Math.sin(a)*(d/2+0.15));
    }
  }
  const thread=new THREE.Mesh(new THREE.TubeGeometry(new Helix(), turns*8, d*0.08, 6, false), steel(0x9aa3ad));
  g.add(head, shank, thread);
  return g;
}
function buildNut(p){
  const spec=ISO_BOLT[p.size]||ISO_BOLT.M8;
  const sh=hexShape(spec.head/2);
  const hole=new THREE.Path(); hole.absarc(0,0,spec.d/2+0.15,0,Math.PI*2,true); sh.holes.push(hole);
  const m=new THREE.Mesh(extrude(sh, spec.nut), steel(0xd0d6de));
  m.rotation.y=Math.PI/2;
  return m;
}
function buildWasher(p){
  const spec=ISO_BOLT[p.size]||ISO_BOLT.M8;
  const m=new THREE.Mesh(extrude(ringShape(spec.head*0.7, spec.d/2+0.2), Math.max(1, spec.d*0.16)), steel(0xc8c8c8));
  m.rotation.y=Math.PI/2;
  return m;
}
function buildBearing(p){
  const di=p.di, Do=p.Do, B=p.B;
  const g=new THREE.Group();
  const outer=new THREE.Mesh(alongX(extrude(ringShape(Do/2, (di+Do)/4+0.8), B)), steel(0x9aa7b5));
  const inner=new THREE.Mesh(alongX(extrude(ringShape((di+Do)/4-0.8, di/2), B)), steel(0x9aa7b5));
  g.add(outer, inner);
  const pitch=(di+Do)/4;
  const ballR=Math.max(0.8, (Do-di)/8);
  const n=Math.max(6, Math.round(pitch*Math.PI / (ballR*2.2)));
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2;
    const b=new THREE.Mesh(new THREE.SphereGeometry(ballR,12,10), steel(0xe8e8f0,0.9,0.18));
    b.position.set(0, Math.cos(a)*pitch, Math.sin(a)*pitch);
    g.add(b);
  }
  return g;
}
function buildPulley(p){
  const R=p.D/2, W=p.W, bore=p.bore/2, groove=p.groove;
  const g=new THREE.Group();
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(Math.max(bore+2,R*0.28), Math.max(bore+2,R*0.28), W*0.7, 28), steel());
  hub.rotation.z=Math.PI/2;
  const rim=new THREE.Mesh(new THREE.CylinderGeometry(R, R, W, 48), steel(0xb7c0ca));
  rim.rotation.z=Math.PI/2;
  const cut=new THREE.Mesh(new THREE.TorusGeometry(R, groove, 10, 48), rubber(0x1a1a1e));
  cut.rotation.y=Math.PI/2;
  const holeVis=new THREE.Mesh(new THREE.CylinderGeometry(bore,bore,W+1,20), steel(0x33363c));
  holeVis.rotation.z=Math.PI/2;
  g.add(rim, hub, cut);
  return g;
}
function buildShaft(p){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(p.d/2,p.d/2,p.L,28), steel(0xbfc6ce));
  m.rotation.z=Math.PI/2;
  return m;
}
function buildSeal(p){
  // yağ keçesi: dış metal + iç kauçuk dudak
  const g=new THREE.Group();
  const outer=new THREE.Mesh(alongX(extrude(ringShape(p.Do/2, p.Do/2-1.2), p.B)), steel(0xaa9a7a));
  const body=new THREE.Mesh(alongX(extrude(ringShape(p.Do/2-1.2, p.di/2+0.8), p.B*0.85)), rubber(0x1c1c1c));
  const lip=new THREE.Mesh(alongX(extrude(ringShape(p.di/2+1.1, p.di/2), p.B*0.35)), rubber(0x111111));
  g.add(outer, body, lip);
  return g;
}
function buildClamp(p){
  const g=new THREE.Group();
  const band=new THREE.Mesh(new THREE.TorusGeometry(p.D/2, p.t/2, 8, 48, Math.PI*1.75), steel(0xc9c9c9));
  band.rotation.y=Math.PI/2;
  const screw=new THREE.Mesh(new THREE.BoxGeometry(p.t*2.2, p.t*3, p.W), steel(0xd5d5d5));
  screw.position.set(0, p.D/2+p.t, 0);
  g.add(band, screw);
  return g;
}
function buildGearP(p){
  const m=new THREE.Mesh(extrude(gearShape(p.teeth, p.D/2, p.bore/2, p.tooth), p.W), steel());
  m.rotation.y=Math.PI/2;
  return m;
}

function beltPoints(c1, r1, c2, r2){
  const y1=c1.y, z1=c1.z, y2=c2.y, z2=c2.z;
  const dy=y2-y1, dz=z2-z1;
  const d=Math.hypot(dy,dz);
  if(d < Math.abs(r1-r2)+2) return null;
  const x=(c1.x+c2.x)/2;
  const theta=Math.atan2(dz, dy);
  const at=(cy,cz,r,a)=>new THREE.Vector3(x, cy+Math.cos(a)*r, cz+Math.sin(a)*r);
  const pts=[], n=16;
  const a1s=theta+Math.PI*0.5, a1e=theta+Math.PI*1.5;
  const a2s=theta+Math.PI*1.5, a2e=theta+Math.PI*2.5;
  for(let i=0;i<=n;i++) pts.push(at(y1,z1,r1, a1s+(a1e-a1s)*i/n));
  const pA=pts[pts.length-1], pB=at(y2,z2,r2,a2s);
  for(let i=1;i<8;i++) pts.push(pA.clone().lerp(pB, i/8));
  for(let i=0;i<=n;i++) pts.push(at(y2,z2,r2, a2s+(a2e-a2s)*i/n));
  const pC=pts[pts.length-1], pD=at(y1,z1,r1,a1s);
  for(let i=1;i<8;i++) pts.push(pC.clone().lerp(pD, i/8));
  return pts;
}
function worldPos(obj){
  obj.updateWorldMatrix(true, false);
  return obj.getWorldPosition(new THREE.Vector3());
}
function buildBeltBetween(objA, objB, thick=4){
  const a=worldPos(objA);
  const b=worldPos(objB);
  const rA=(objA.userData.params?.D||objA.userData.params?.Do||36)/2 + thick*0.35;
  const rB=(objB.userData.params?.D||objB.userData.params?.Do||36)/2 + thick*0.35;
  a.x=b.x=(a.x+b.x)/2;
  const pts=beltPoints(a, rA, b, rB);
  if(!pts) return null;
  const curve=new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.0);
  const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve, 200, thick*0.42, 10, true), rubber(0x1b1b1f));
  const g=new THREE.Group();
  g.add(mesh);
  return g;
}

const PARAM_DEFS = {

      {k:'W', label:'Kalınlık', min:4, max:24, step:1},
      {k:'bore', label:'Delik', min:4, max:30, step:1},
      {k:'tooth', label:'Diş boyu', min:1.2, max:6, step:0.1}
    ], defaults:{teeth:20, D:36, W:8, bore:10, tooth:3}, build:buildGearP, axis:'x'
  }
};

const CATALOG = [
  {id:101,name:'Cıvata (parametrik)',cat:'Tasarım', kind:'bolt'},
  {id:102,name:'Somun (parametrik)',cat:'Tasarım', kind:'nut'},
  {id:103,name:'Pul (parametrik)',cat:'Tasarım', kind:'washer'},
  {id:104,name:'Rulman (parametrik)',cat:'Tasarım', kind:'bearing'},
  {id:105,name:'Makara (parametrik)',cat:'Tasarım', kind:'pulley'},
  {id:106,name:'Mil (parametrik)',cat:'Tasarım', kind:'shaft'},

let selected=null;
const multi=new Set();
const outlines=new Map();

function resize(){
  const w=viewport.clientWidth, h=viewport.clientHeight;
  camera.aspect=w/Math.max(h,1); camera.updateProjectionMatrix(); renderer.setSize(w,h);
}

function sitOnGround(obj){
  const box=new THREE.Box3().setFromObject(obj);
  if(isFinite(box.min.y)) obj.position.y -= box.min.y;
}

function wrapPart(obj, meta, kind, params){
  applyMesh(obj);
  obj.userData.meta=meta;
  obj.userData.kind=kind||null;
  obj.userData.params=params?{...params}:null;
  return obj;
}

function makeFromKind(kind, params){
  const def=PARAM_DEFS[kind];
  const p={...def.defaults, ...(params||{})};
  return wrapPart(def.build(p), {name:def.name, cat:'Tasarım'}, kind, p);
}

function addCatalog(item, extraParams){
  if(item.kit){ buildKit(item.kit); return; }
  let obj;
  if(item.kind){
    obj=makeFromKind(item.kind, extraParams);
    obj.userData.meta={id:item.id, name:item.name, cat:item.cat};
  } else {
    let raw=item.make();
    if(!raw.isObject3D) raw=new THREE.Mesh(raw, steel());
    obj=wrapPart(raw, {id:item.id, name:item.name, cat:item.cat});
  }
  const n=parts.children.length;
  obj.position.set((n%6)*14-30, 0, Math.floor(n/6)*16);
  sitOnGround(obj);
  parts.add(obj);
  select(obj, false);
  setStatus('eklendi: '+item.name);
  return obj;
}

function rebuildSelected(){
  if(!selected || !selected.userData.kind) return;
  const kind=selected.userData.kind;
  const params=selected.userData.params;
  const pos=selected.position.clone();
  const rot=selected.rotation.clone();
  const scl=selected.scale.clone();
  const meta=selected.userData.meta;
  const neu=makeFromKind(kind, params);
  neu.position.copy(pos); neu.rotation.copy(rot); neu.scale.copy(scl);
  neu.userData.meta=meta;
  const idx=parts.children.indexOf(selected);
  parts.remove(selected);
  disposeObj(selected);
  parts.add(neu);
  if (idx >= 0) {
    parts.children.pop();
    parts.children.splice(idx, 0, neu);
  }
  select(neu, false);
}

function disposeObj(obj){
  obj.traverse(o=>{ if(o.geometry) o.geometry.dispose(); });
}

function rootOf(hit){
  let o=hit;
  while(o.parent && o.parent!==parts) o=o.parent;
  return o.parent===parts ? o : null;
}

function select(obj, add=false){
  if(!add){
    multi.clear();
    outlines.forEach(h=> { scene.remove(h); });
    outlines.clear();
  }
  selected=obj;
  if(obj){
    multi.add(obj);
    transform.attach(obj);
  } else transform.detach();
  // highlight
  multi.forEach(o=>{
    if(outlines.has(o)) return;
    const box=new THREE.BoxHelper(o, 0xf5a524);
    outlines.set(o, box); scene.add(box);
  });
  [...outlines.keys()].forEach(o=>{
    if(!multi.has(o)){ scene.remove(outlines.get(o)); outlines.delete(o); }
  });
  renderProps(); updateHud();
}

viewport.addEventListener('pointerdown', e=>{
  if(transform.dragging) return;
  const r=renderer.domElement.getBoundingClientRect();
  const p=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  const ray=new THREE.Raycaster(); ray.setFromCamera(p, camera);
  const meshes=[]; parts.traverse(o=>{ if(o.isMesh) meshes.push(o); });
  const hits=ray.intersectObjects(meshes, true);
  if(hits.length){
    const o=rootOf(hits[0].object);
    if(o) select(o, e.shiftKey);
  }
});

function setStatus(t){ document.getElementById('status').textContent=t; }

function deleteSelected(){
  [...multi].forEach(o=>{
    parts.remove(o); disposeObj(o);
    if(outlines.has(o)){ scene.remove(outlines.get(o)); outlines.delete(o); }
  });
  multi.clear(); select(null);
}
function duplicateSelected(){
  if(!selected) return;
  const item=CATALOG.find(c=>c.id===selected.userData.meta?.id);
  let neu;
  if(selected.userData.kind) neu=makeFromKind(selected.userData.kind, selected.userData.params);
  else if(item && item.make){
    let raw=item.make(); if(!raw.isObject3D) raw=new THREE.Mesh(raw,steel());
    neu=wrapPart(raw, selected.userData.meta);
  } else return;
  neu.position.copy(selected.position).add(new THREE.Vector3(14,0,10));
  neu.rotation.copy(selected.rotation); neu.scale.copy(selected.scale);
  parts.add(neu); select(neu);
}

function groupSelected(){
  if(multi.size<2){ setStatus('grup için Shift ile en az 2 parça seç'); return; }
  const g=new THREE.Group();
  const arr=[...multi];
  const c=new THREE.Vector3();
  arr.forEach(o=> c.add(o.getWorldPosition(new THREE.Vector3())));
  c.multiplyScalar(1/arr.length);
  g.position.copy(c);
  arr.forEach(o=>{
    const w=o.getWorldPosition(new THREE.Vector3());
    const q=o.getWorldQuaternion(new THREE.Quaternion());
    const s=o.getWorldScale(new THREE.Vector3());
    parts.remove(o);
    g.add(o);
    o.position.copy(w.sub(c));
    o.quaternion.copy(q);
    o.scale.copy(s);
  });
  g.userData.meta={name:'Montaj grubu', cat:'Montaj'};
  g.userData.kind=null;
  parts.add(g);
  select(g);
  setStatus('gruplandı ('+arr.length+' parça)');
}
function ungroupSelected(){
  if(!selected || selected.children.length===0 || selected.userData.kind) { setStatus('çözülecek grup yok'); return; }
  const kids=[...selected.children];
  kids.forEach(ch=>{
    const w=ch.getWorldPosition(new THREE.Vector3());
    const q=ch.getWorldQuaternion(new THREE.Quaternion());
    selected.remove(ch);
    parts.add(ch);
    ch.position.copy(w); ch.quaternion.copy(q);
  });
  parts.remove(selected);
  select(kids[0]||null);
  setStatus('grup çözüldü');
}
function alignAxes(){
  if(multi.size<2){ setStatus('önce 2+ parça seç (ilk = referans)'); return; }
  const arr=[...multi];
  const ref=arr[0];
  const rq=ref.getWorldQuaternion(new THREE.Quaternion());
  const rp=ref.getWorldPosition(new THREE.Vector3());
  const axis=new THREE.Vector3(1,0,0).applyQuaternion(rq);
  arr.slice(1).forEach((o,i)=>{
    o.quaternion.copy(rq);
    o.position.copy(rp).add(axis.clone().multiplyScalar((i+1)*18));
    sitOnGround(o);
  });
  setStatus('eksenler hizalandı (yerel X)');
}
function beltJoin(){
  const arr=[...multi].filter(o=>o.userData.kind==='pulley' || o.userData.kind==='gear' || (o.userData.meta?.name||'').toLowerCase().includes('makara'));
  const pair = arr.length>=2 ? arr : [...multi];
  if(pair.length<2){ setStatus('kayış için 2 makara/dişli seç'); return; }
  const belt=buildBeltBetween(pair[0], pair[1], 4, 10);
  if(!belt){ setStatus('kayış üretilemedi'); return; }
  belt.userData.meta={name:'Kayış', cat:'Montaj'};
  belt.userData.kind='belt';
  belt.userData.params={thick:4};
  applyMesh(belt);
  parts.add(belt);
  select(belt);
  setStatus('kayış bağlandı');
}

function buildKit(type){
  const created=[];
  const Y=28;
  if(type==='shaftBearings'){
    const sh=makeFromKind('shaft',{d:10,L:90}); sh.position.set(0,Y,0);
    const b1=makeFromKind('bearing',{di:10,Do:26,B:8}); b1.position.set(-28,Y,0);
    const b2=makeFromKind('bearing',{di:10,Do:26,B:8}); b2.position.set(28,Y,0);
    created.push(sh,b1,b2);
  }
  if(type==='beltDrive'){
    const s1=makeFromKind('shaft',{d:10,L:56}); s1.position.set(0,Y,-42);
    const s2=makeFromKind('shaft',{d:10,L:56}); s2.position.set(0,Y, 42);
    const p1=makeFromKind('pulley',{D:36,W:12,bore:10,groove:3}); p1.position.set(0,Y,-42);
    const p2=makeFromKind('pulley',{D:52,W:12,bore:10,groove:3}); p2.position.set(0,Y, 42);
    created.push(s1,s2,p1,p2);
    parts.add(...created);
    p1.updateMatrixWorld(true);
    p2.updateMatrixWorld(true);
    const belt=buildBeltBetween(p1,p2,4);
    if(belt){ belt.userData.meta={name:'Kayış',cat:'Montaj'}; belt.userData.kind='belt'; applyMesh(belt); parts.add(belt); }
    select(p1);
    setStatus('kayış-makara kiti eklendi');
    camera.position.set(90, 55, 110);
    orbit.target.set(0, 28, 0);
    orbit.update();
    return;
  }
  if(type==='fastener'){
    const bolt=makeFromKind('bolt',{size:'M8',length:28}); bolt.position.set(0,Y,0);
    const w=makeFromKind('washer',{size:'M8'}); w.position.set(14,Y,0);
    const n=makeFromKind('nut',{size:'M8'}); n.position.set(24,Y,0);
    created.push(bolt,w,n);
  }
  if(type==='fullShaft'){
    const sh=makeFromKind('shaft',{d:12,L:110}); sh.position.set(0,Y,0);
    const br=makeFromKind('bearing',{di:12,Do:32,B:10}); br.position.set(-36,Y,0);
    const se=makeFromKind('seal',{di:12,Do:28,B:7}); se.position.set(-22,Y,0);
    const pu=makeFromKind('pulley',{D:48,W:14,bore:12,groove:3.5}); pu.position.set(8,Y,0);
    const br2=makeFromKind('bearing',{di:12,Do:32,B:10}); br2.position.set(40,Y,0);
    created.push(sh,br,se,pu,br2);
  }
  created.forEach(o=> parts.add(o));
  select(created[0]||null);
  setStatus('montaj kiti eklendi');
  fit();
}

function exportSTL(){
  const exp=new STLExporter();
  const tmp=new THREE.Group();
  parts.children.forEach(c=>tmp.add(c.clone(true)));
  const data=exp.parse(tmp,{binary:true});
  const blob=new Blob([data],{type:'application/octet-stream'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='makinecad.stl'; a.click();
  setStatus('STL indirildi');
}
function fit(){
  const box=new THREE.Box3().setFromObject(parts);
  if(box.isEmpty()){ camera.position.set(110,80,130); orbit.target.set(0,12,0); return; }
  const size=box.getSize(new THREE.Vector3()).length();
  const c=box.getCenter(new THREE.Vector3());
  orbit.target.copy(c);
  camera.position.copy(c).add(new THREE.Vector3(size*0.7,size*0.55,size*0.85));
  orbit.update();
}

  if(e.key==='g'||e.key==='G'){ transform.setMode('translate'); setTool('btnMove'); }
  if(e.key==='r'||e.key==='R'){ transform.setMode('rotate'); setTool('btnRot'); }
  if(e.key==='s'||e.key==='S'){ transform.setMode('scale'); setTool('btnScale'); }
  if((e.ctrlKey||e.metaKey)&&e.key==='d'){ e.preventDefault(); duplicateSelected(); }
});

function renderProps(){
  const box=document.getElementById('props');
  if(!selected){
    box.innerHTML=`
      <div class="empty">Parça seçili değil.</div>
      <h3>Hazır montaj</h3>
      <button class="kit ok" data-kit="beltDrive">2 Makara + Kayış</button>
      <button class="kit ok" data-kit="shaftBearings">Mil + 2 Rulman</button>
      <button class="kit ok" data-kit="fastener">Cıvata + Pul + Somun</button>
      <button class="kit ok" data-kit="fullShaft">Mil + Makara + Keçe + Rulman</button>
      <p class="hint">Tasarım sekmesinden cıvata / rulman / makara / keçe ölçülerini değiştir. Shift ile iki makara seçip <b>Kayış bağla</b>. İki parçayı seçip <b>Eksen hizala</b> veya <b>Grupla</b>.</p>`;
    box.querySelectorAll('[data-kit]').forEach(b=> b.onclick=()=>buildKit(b.dataset.kit));
    return;
  }
  const m=selected.userData.meta||{name:'Parça'};
  const kind=selected.userData.kind;
  const p=selected.position, r=selected.rotation, s=selected.scale;
  let html=`<div class="selname">${m.name}</div>
    <div class="hint">${kind?('parametrik · '+kind): (m.cat||'')} · seçili ${multi.size}</div>`;
  if(kind && PARAM_DEFS[kind]){
    html+=`<h3>Parça ölçüleri</h3>`;
    PARAM_DEFS[kind].fields.forEach(f=>{
      const val=selected.userData.params[f.k];
      if(f.type==='select'){
        html+=`<label class="row"><span>${f.label}</span><select class="field" data-pk="${f.k}">${f.opts.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select><span></span></label>`;
      } else {
        html+=`<label class="row"><span>${f.label}</span><input data-pk="${f.k}" type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${val}" /><input data-pn="${f.k}" type="number" step="${f.step}" value="${val}" /></label>`;
      }
    });
  }
  html+=`
    <h3>X Y Z Çarpanları</h3>
    ${slider('sx','X çarpanı',s.x,0.05,8,0.01)}
    ${slider('sy','Y çarpanı',s.y,0.05,8,0.01)}
    ${slider('sz','Z çarpanı',s.z,0.05,8,0.01)}
    <h3>Konum mm</h3>
    ${num('px','X',p.x)}${num('py','Y',p.y)}${num('pz','Z',p.z)}
    <h3>Dönüş °</h3>
    ${num('rx','X',r.x*180/Math.PI)}${num('ry','Y',r.y*180/Math.PI)}${num('rz','Z',r.z*180/Math.PI)}
    <p class="hint">Ölçü değiştirince parça yeniden üretilir. Montaj için Shift+tık.</p>`;
  box.innerHTML=html;
  bind('sx',v=>selected.scale.x=v); bind('sy',v=>selected.scale.y=v); bind('sz',v=>selected.scale.z=v);
  bindNum('px',v=>selected.position.x=v); bindNum('py',v=>selected.position.y=v); bindNum('pz',v=>selected.position.z=v);
  bindNum('rx',v=>selected.rotation.x=v*Math.PI/180);
  bindNum('ry',v=>selected.rotation.y=v*Math.PI/180);
  bindNum('rz',v=>selected.rotation.z=v*Math.PI/180);
  box.querySelectorAll('[data-pk]').forEach(el=>{
    const go=()=>{
      const k=el.dataset.pk;
      let v=el.tagName==='SELECT'? el.value : parseFloat(el.value);
      selected.userData.params[k]=v;
      const n=box.querySelector(`[data-pn="${k}"]`);
      if(n) n.value=v;
      rebuildSelected();
    };
    el.oninput=go; el.onchange=go;
  });
  box.querySelectorAll('[data-pn]').forEach(el=>{
    el.onchange=()=>{
      const k=el.dataset.pn;
      selected.userData.params[k]=parseFloat(el.value);
      const r=box.querySelector(`[data-pk="${k}"]`);
      if(r) r.value=el.value;
      rebuildSelected();
    };
  });
}
function slider(id,label,val,min,max,step){
  return `<label class="row"><span>${label}</span><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${val}" /><input id="${id}_n" type="number" step="${step}" value="${Number(val).toFixed(2)}" /></label>`;
}
function num(id,label,val){
  return `<label class="row"><span>${label}</span><input id="${id}" type="number" step="0.5" value="${Number(val).toFixed(2)}" /><span></span></label>`;
}
function bind(id,fn){
  const r=document.getElementById(id), n=document.getElementById(id+'_n');
  if(!r) return;
  const go=()=>{ const v=parseFloat(r.value); n.value=Number(v).toFixed(2); fn(v); updateHud(); };
  r.oninput=go; n.onchange=()=>{ r.value=n.value; go(); };
}
function bindNum(id,fn){
  const n=document.getElementById(id); if(!n) return;
  n.oninput=()=>{ fn(parseFloat(n.value)||0); updateHud(); };
}
function syncScale(){
  if(!selected) return;
  const sx=document.getElementById('sx'); if(!sx) return;
  sx.value=selected.scale.x; document.getElementById('sx_n').value=selected.scale.x.toFixed(2);
  document.getElementById('sy').value=selected.scale.y; document.getElementById('sy_n').value=selected.scale.y.toFixed(2);
  document.getElementById('sz').value=selected.scale.z; document.getElementById('sz_n').value=selected.scale.z.toFixed(2);
}
function updateHud(){
  const hud=document.getElementById('hud');
  outlines.forEach((h,o)=> h.update());
  if(!selected){ hud.textContent=parts.children.length+' parça'; return; }
  const b=new THREE.Box3().setFromObject(selected);
  const sz=b.getSize(new THREE.Vector3());
  const m=selected.userData.meta||{};
  hud.innerHTML=`<b>${m.name||'Parça'}</b> · ${multi.size} seçili<br>XYZ çarpan ${selected.scale.x.toFixed(2)} · ${selected.scale.y.toFixed(2)} · ${selected.scale.z.toFixed(2)}<br>Boyut ≈ ${sz.x.toFixed(1)} × ${sz.y.toFixed(1)} × ${sz.z.toFixed(1)} mm`;
}

function animate(){ requestAnimationFrame(animate); orbit.update(); renderer.render(scene,camera); }
animate();
renderProps();
buildKit('beltDrive');
</script>
</body>
</html>
